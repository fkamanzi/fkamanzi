<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Send the log, get a written root cause with the fix within 3 days"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1426"/><stop offset="1" stop-color="#10223F"/></linearGradient></defs><rect width="100%" height="100%" rx="16" fill="url(#bg)"/><style>.h{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#fff;font-size:24px;font-weight:700} .a{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#F5A623;font-size:24px;font-weight:700} .k{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#fff;font-size:18px;font-weight:700} .l{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#9FB3D1;font-size:14px}@keyframes d{to{stroke-dashoffset:-24}} .flow{stroke-dasharray:8 4;animation:d 1s linear infinite}</style><text x="40" y="52" class="h">Stuck escalation? Send the evidence.</text><text x="1160" y="52" class="a" text-anchor="end">Written RCA in 3 days</text><rect x="40" y="86" width="330" height="104" rx="12" fill="#13284A" stroke="#24426E"/><circle cx="74" cy="122" r="16" fill="#F5A623"/><text x="74" y="128" text-anchor="middle" class="k" style="fill:#0B1426">1</text><text x="102" y="128" class="k">Send the log</text><text x="64" y="166" class="l">trace, alarm export, KPI or CDR file</text><line x1="374" y1="138" x2="416" y2="138" stroke="#4FC3F7" stroke-width="3" class="flow"/><rect x="420" y="86" width="330" height="104" rx="12" fill="#13284A" stroke="#24426E"/><circle cx="454" cy="122" r="16" fill="#F5A623"/><text x="454" y="128" text-anchor="middle" class="k" style="fill:#0B1426">2</text><text x="482" y="128" class="k">Evidence-locked read</text><text x="444" y="166" class="l">first deviation, cause value, scope</text><line x1="754" y1="138" x2="796" y2="138" stroke="#4FC3F7" stroke-width="3" class="flow"/><rect x="800" y="86" width="330" height="104" rx="12" fill="#13284A" stroke="#24426E"/><circle cx="834" cy="122" r="16" fill="#F5A623"/><text x="834" y="128" text-anchor="middle" class="k" style="fill:#0B1426">3</text><text x="862" y="128" class="k">Root cause + fix</text><text x="824" y="166" class="l">MOP, rollback, verification gates</text></svg>