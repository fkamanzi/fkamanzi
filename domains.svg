<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-label="36 tools by domain"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1426"/><stop offset="1" stop-color="#10223F"/></linearGradient></defs><rect width="100%" height="100%" rx="16" fill="url(#bg)"/><style>.h{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#fff;font-size:22px;font-weight:700} .l{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#DCE6F5;font-size:16px} .v{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#fff;font-size:16px;font-weight:700} .c{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#9FB3D1;font-size:13px}@keyframes g{from{transform:scaleX(0)}to{transform:scaleX(1)}} .bar{transform-box:fill-box;transform-origin:left;animation:g 1.2s ease-out both}</style><text x="40" y="50" class="h">Telecom first, then every sector that runs on the network</text><text x="40" y="101" class="l">Telecom radio, core &amp; quality</text><rect x="380" y="82" width="630" height="26" rx="5" fill="#F5A623" class="bar" style="animation-delay:0.0s"/><text x="1020" y="101" class="v">9</text><text x="40" y="139" class="l">Public services &amp; transport</text><rect x="380" y="120" width="490" height="26" rx="5" fill="#3E6FB0" class="bar" style="animation-delay:0.12s"/><text x="880" y="139" class="v">7</text><text x="40" y="177" class="l">Banking, insurance &amp; microfinance</text><rect x="380" y="158" width="420" height="26" rx="5" fill="#3E6FB0" class="bar" style="animation-delay:0.24s"/><text x="810" y="177" class="v">6</text><text x="40" y="215" class="l">Fraud &amp; revenue assurance</text><rect x="380" y="196" width="420" height="26" rx="5" fill="#3E6FB0" class="bar" style="animation-delay:0.36s"/><text x="810" y="215" class="v">6</text><text x="40" y="253" class="l">Energy, power &amp; data centres</text><rect x="380" y="234" width="350" height="26" rx="5" fill="#3E6FB0" class="bar" style="animation-delay:0.48s"/><text x="740" y="253" class="v">5</text><text x="40" y="291" class="l">ERP &amp; e-invoicing (Odoo)</text><rect x="380" y="272" width="210" height="26" rx="5" fill="#3E6FB0" class="bar" style="animation-delay:0.6s"/><text x="600" y="291" class="v">3</text><text x="40" y="332" class="c">Each tool runs in the browser: the file is read on your machine, nothing is uploaded. Built-in sample runs free; your own file opens with a 3-day trial code.</text></svg>